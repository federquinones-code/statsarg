<!DOCTYPE html>
<html lang="es-AR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>STATSARG · Básquet Argentino</title>
<link rel="icon" type="image/svg+xml" href="assets/statsarg-logo.svg">
<style>
  :root{
    --bg:#0a1322; --panel:#101c2f; --panel2:#16263c; --line:#233850;
    --txt:#eef3f8; --muted:#8497ad; --accent:#2ee0c6; --accent-b:#38b6ff;
    --accent2:#2ee0c6; --chip:#1a2b41; --warn:#f0a53d; --gold:#ffcf5c;
  }
  *{box-sizing:border-box}
  body{margin:0;font-family:"Segoe UI",system-ui,Arial,sans-serif;
    background:radial-gradient(1100px 560px at 82% -12%, #123047 0%, transparent 58%), var(--bg);
    color:var(--txt);font-size:14px}
  a{color:inherit;text-decoration:none}
  ::-webkit-scrollbar{width:10px;height:10px}::-webkit-scrollbar-thumb{background:#2c3752;border-radius:6px}
  /* Header / marca */
  header{padding:0 22px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:20px;
    flex-wrap:wrap;background:linear-gradient(180deg,#101826,#0d1119);min-height:64px}
  .brand{display:flex;align-items:center;gap:13px}
  .brand .logo-badge{height:46px;width:46px;border-radius:50%;box-shadow:0 3px 12px #0006,0 0 0 1px #2ee0c633}
  .brand .tag{color:var(--muted);font-size:11px;letter-spacing:1.5px;text-transform:uppercase;border-left:1px solid var(--line);padding-left:13px}
  header .leagues{display:flex;gap:14px;align-items:center;margin-left:6px}
  header .leagues img{height:26px;opacity:.85;filter:saturate(1.1)}
  header .spacer{flex:1}
  .cmp-switch{font-size:12.5px;color:var(--muted);display:flex;align-items:center;gap:7px;cursor:pointer;
    padding:7px 12px;border:1px solid var(--line);border-radius:9px;background:var(--panel2)}
  .cmp-switch.on{border-color:var(--accent);color:var(--txt)}
  .wrap{display:flex;min-height:calc(100vh - 65px)}
  /* Filtros */
  aside{width:280px;flex:none;border-right:1px solid var(--line);padding:16px;overflow:auto;background:var(--panel)}
  aside h3{font-size:10.5px;text-transform:uppercase;letter-spacing:1.2px;color:var(--muted);margin:18px 0 9px;font-weight:700}
  aside h3:first-child{margin-top:0}
  .search{width:100%;padding:10px 12px;border-radius:9px;border:1px solid var(--line);background:var(--panel2);color:var(--txt);font-size:14px}
  .search:focus{outline:none;border-color:var(--accent)}
  .chips{display:flex;flex-direction:column;gap:7px}
  .chip{display:flex;align-items:center;gap:9px;padding:8px 11px;border-radius:10px;border:1px solid var(--line);
    background:var(--chip);cursor:pointer;font-size:12.5px;user-select:none;transition:.15s}
  .chip img{height:22px;width:22px;object-fit:contain}
  .chip.on{background:#26314a;border-color:var(--accent-b);font-weight:600}
  .chip .cnt{margin-left:auto;color:var(--muted);font-size:11px}
  .slabel{display:flex;justify-content:space-between;align-items:baseline}
  .rangeval{color:var(--accent);font-weight:800;font-size:15px}
  input[type=range]{width:100%;accent-color:var(--accent);margin-top:4px}
  .ticks{display:flex;justify-content:space-between;color:var(--muted);font-size:10px;margin-top:2px}
  .row2{display:flex;gap:8px}
  .row2 input{width:100%;padding:8px 9px;border-radius:8px;border:1px solid var(--line);background:var(--panel2);color:var(--txt)}
  select{width:100%;padding:9px;border-radius:8px;border:1px solid var(--line);background:var(--panel2);color:var(--txt)}
  .note{font-size:11px;color:var(--muted);margin-top:6px;line-height:1.4}
  button.btn{width:100%;margin-top:16px;padding:10px;border-radius:9px;border:1px solid var(--line);background:var(--panel2);color:var(--txt);cursor:pointer;font-size:13px}
  button.btn:hover{border-color:var(--accent)}
  /* Lista */
  main{flex:1;padding:16px 18px;overflow:auto}
  .toolbar{display:flex;align-items:center;gap:12px;margin-bottom:14px;flex-wrap:wrap}
  .count{color:var(--txt);font-size:14px;font-weight:600}
  .count b{color:var(--accent)}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px}
  .card{background:linear-gradient(180deg,var(--panel2),var(--panel));border:1px solid var(--line);border-radius:13px;
    padding:13px;cursor:pointer;transition:.15s;position:relative;overflow:hidden}
  .card:hover{border-color:var(--accent);transform:translateY(-2px);box-shadow:0 8px 22px #0006}
  .card.sel{border-color:var(--accent2);box-shadow:0 0 0 1.5px var(--accent2)}
  .card .cardtop{display:flex;gap:11px;align-items:center}
  .card .foto{width:52px;height:52px;border-radius:11px;object-fit:cover;background:var(--chip);border:1px solid var(--line);flex:none}
  .card .foto.ph{display:flex;align-items:center;justify-content:center;color:var(--muted);font-size:20px;font-weight:700}
  .card .who{min-width:0;flex:1}
  .card .nm{font-weight:700;font-size:14.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .card .tm{color:var(--muted);font-size:11.5px;display:flex;align-items:center;gap:6px;margin-top:2px}
  .card .tm img{width:16px;height:16px;object-fit:contain}
  .card .tm span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .card .meta{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap}
  .pill{font-size:10px;padding:2px 7px;border-radius:6px;background:var(--chip);color:var(--muted)}
  .pill.pos{background:#2a2036;color:#e6b3ff}
  .pill.pos.est{opacity:.7}
  .pill.age{background:#1e2c2a;color:#7fe0c8}
  .card .stats{display:flex;gap:10px;margin-top:11px;border-top:1px solid var(--line);padding-top:9px}
  .card .stat b{display:block;font-size:16px}
  .card .stat span{font-size:9px;color:var(--muted);text-transform:uppercase;letter-spacing:.4px}
  .lgbadge{position:absolute;top:10px;right:10px;height:20px;opacity:.9}
  /* Ficha */
  .overlay{position:fixed;inset:0;background:#000a;display:none;z-index:50}
  .overlay.on{display:flex;align-items:flex-start;justify-content:center;overflow:auto;padding:24px}
  .sheet{background:var(--panel);border:1px solid var(--line);border-radius:18px;max-width:980px;width:100%;overflow:hidden;box-shadow:0 20px 60px #000a}
  .sheet .top{display:flex;gap:18px;padding:20px 24px;background:linear-gradient(120deg,#20293e,var(--panel));border-bottom:1px solid var(--line);align-items:center;position:relative}
  .sheet .top .lgwm{position:absolute;right:60px;top:50%;transform:translateY(-50%);height:52px;opacity:.14}
  .foto-lg{width:76px;height:76px;border-radius:14px;object-fit:cover;background:var(--chip);border:1px solid var(--line);flex:none}
  .logo{width:50px;height:50px;object-fit:contain;background:#fff1;border-radius:9px;padding:3px}
  .sheet .top .id h2{margin:0;font-size:24px}
  .sheet .top .id .m{color:var(--muted);font-size:13.5px;margin-top:4px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
  .close{margin-left:auto;background:var(--chip);border:1px solid var(--line);color:var(--txt);width:36px;height:36px;border-radius:9px;cursor:pointer;font-size:18px;z-index:2}
  .body{display:grid;grid-template-columns:1fr 1fr;gap:22px;padding:24px}
  @media(max-width:820px){.body{grid-template-columns:1fr}}
  .block h4{font-size:11px;text-transform:uppercase;letter-spacing:1px;color:var(--muted);margin:0 0 11px;border-bottom:1px solid var(--line);padding-bottom:7px}
  .kv{display:grid;grid-template-columns:1fr auto;gap:7px 12px;font-size:13.5px}
  .kv .k{color:var(--muted)}.kv .v{font-weight:700;text-align:right}
  .big4{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;text-align:center;margin-bottom:15px}
  .big4 .b{background:var(--panel2);border:1px solid var(--line);border-radius:11px;padding:10px 4px}
  .big4 .b b{display:block;font-size:21px;color:var(--accent)}
  .big4 .b.blue b{color:var(--accent-b)}
  .big4 .b span{font-size:9.5px;color:var(--muted);text-transform:uppercase}
  .ff{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;text-align:center;margin-top:6px}
  .ff .b{background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:9px 3px}
  .ff .b b{display:block;font-size:16px}.ff .b span{font-size:9px;color:var(--muted)}
  .shotmap{width:100%;border-radius:12px;background:#fff;border:1px solid var(--line)}
  .miss{color:var(--muted);font-size:12px;padding:34px;text-align:center;border:1px dashed var(--line);border-radius:12px}
  .pm{color:var(--accent2)}.pm.neg{color:#ff7b7b}
  /* Comparar */
  .cmpbar{position:fixed;bottom:0;left:0;right:0;background:linear-gradient(180deg,#1c2436,#161d2b);border-top:2px solid var(--accent);
    padding:11px 20px;display:none;align-items:center;gap:10px;z-index:40;box-shadow:0 -8px 24px #0007}
  .cmpbar.on{display:flex}
  .cmpbar .lbl{font-size:13px;font-weight:700;color:var(--accent)}
  .cmpbar .slots{display:flex;gap:8px;flex-wrap:wrap;flex:1}
  .cmpbar .slot{display:flex;align-items:center;gap:6px;padding:6px 10px;border:1px dashed var(--line);border-radius:9px;color:var(--muted);font-size:12.5px}
  .cmpbar .slot.full{border-style:solid;border-color:var(--accent2);color:var(--txt);background:#1a2432}
  .cmpbar .slot .x{cursor:pointer;color:var(--muted);font-weight:700}
  .cmpbar button{padding:9px 18px;border-radius:9px;border:none;background:var(--accent);color:#fff;cursor:pointer;font-weight:700}
  .cmpbar button:disabled{opacity:.4;cursor:default}
  /* Tabla comparativa */
  .cmptable{width:100%;border-collapse:collapse;font-size:13px}
  .cmptable th,.cmptable td{padding:9px 10px;text-align:center;border-bottom:1px solid var(--line)}
  .cmptable th.lbl,.cmptable td.lbl{text-align:left;color:var(--muted);white-space:nowrap;font-weight:600}
  .cmptable thead th{background:var(--panel2);vertical-align:bottom}
  .cmptable .phead{display:flex;flex-direction:column;align-items:center;gap:5px}
  .cmptable .phead img.f{width:44px;height:44px;border-radius:10px;object-fit:cover;background:var(--chip)}
  .cmptable .phead .n{font-weight:700;font-size:12.5px;max-width:110px;line-height:1.15}
  .cmptable .phead .t{color:var(--muted);font-size:10.5px}
  .cmptable td.best{color:var(--accent2);font-weight:800}
  .cmpmaps{display:grid;gap:10px;padding:18px;grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}
  .cmpmaps figure{margin:0;text-align:center}.cmpmaps img{width:100%;border-radius:8px;background:#fff}
  .cmpmaps figcaption{font-size:11px;color:var(--muted);margin-top:4px}
</style>
</head>
<body>
<header>
  <div class="brand">
    <img class="logo-badge" src="assets/statsarg-logo.svg" alt="STATSARG">
    <span class="tag">Básquet Argentino</span>
  </div>
  <div class="leagues" id="hLeagues"></div>
  <div class="spacer"></div>
  <span class="sub" id="hsub" style="color:var(--muted);font-size:12px"></span>
  <label class="cmp-switch" id="cmpSwitch"><input type="checkbox" id="cmpToggle" style="accent-color:var(--accent)"> Comparar (hasta 5)</label>
</header>

<div class="wrap">
  <aside>
    <h3>Buscar jugador</h3>
    <input class="search" id="q" placeholder="Apellido…">

    <h3>Liga</h3>
    <div class="chips" id="ligaChips"></div>

    <h3>Minutos por partido (mínimo)</h3>
    <div class="slabel"><span class="note" style="margin:0">al menos</span><span class="rangeval"><span id="minLbl">10</span> min</span></div>
    <input type="range" id="minMin" min="0" max="40" step="1" value="10">
    <div class="ticks"><span>0</span><span>10</span><span>20</span><span>30</span><span>40</span></div>

    <h3>Posición</h3>
    <select id="posSel"><option value="">Todas</option></select>
    <div class="note" id="posNote"></div>

    <h3>Edad</h3>
    <div class="row2"><input type="number" id="edadMin" placeholder="mín" min="14" max="50"><input type="number" id="edadMax" placeholder="máx" min="14" max="50"></div>
    <label class="note" style="display:flex;gap:6px;margin-top:7px;cursor:pointer"><input type="checkbox" id="edadSinDato" checked> incluir sin edad</label>
    <div class="note" id="edadNote"></div>

    <button class="btn" id="reset">Limpiar filtros</button>
    <div class="note" id="dataNote" style="margin-top:18px"></div>
  </aside>

  <main>
    <div class="toolbar">
      <span class="count" id="count"></span>
      <select id="sortSel" style="width:auto;margin-left:auto">
        <option value="pts">Ordenar: Puntos</option>
        <option value="per">Valoración (PER)</option>
        <option value="min_pg">Minutos/partido</option>
        <option value="ts">TS%</option>
        <option value="reb">Rebotes</option>
        <option value="ast">Asistencias</option>
        <option value="pm">+/-</option>
      </select>
    </div>
    <div class="grid" id="grid"></div>
  </main>
</div>

<div class="overlay" id="overlay"><div class="sheet" id="sheet"></div></div>

<div class="cmpbar" id="cmpbar">
  <span class="lbl">Comparar</span>
  <div class="slots" id="slots"></div>
  <button id="cmpGo" disabled>Ver comparación →</button>
</div>

<script src="players_data.js"></script>
<script>
const DATA=window.STATSARG, P=DATA.players, LIGAS=DATA.ligas;
const LGLOGO=l=>`assets/leagues/${l}.png`;
const state={ligas:new Set(Object.keys(LIGAS)),q:"",minMin:10,pos:"",edadMin:null,edadMax:null,edadSin:true,sort:"pts",cmp:false,cmpList:[]};
const MAXCMP=5;
const $=s=>document.querySelector(s);
const el=(t,c,h)=>{const e=document.createElement(t);if(c)e.className=c;if(h!=null)e.innerHTML=h;return e;};
const pct=v=>(v==null?"–":v.toFixed(1)+"%");
const lgName=k=>LIGAS[k]||k;
const getSort=(p,k)=>({pts:p.trad.pts,per:p.adv.per,min_pg:p.min_pg,ts:p.adv.ts,reb:p.trad.reb,ast:p.trad.ast,pm:p.adv.pm}[k]);
const imgOr=(src,cls,alt)=>src?`<img class="${cls}" src="${src}" alt="" loading="lazy" onerror="this.classList.add('ph');this.removeAttribute('src')">`:`<div class="${cls} ph">${alt||''}</div>`;

// Header ligas
function buildHeader(){
  const h=$("#hLeagues");
  for(const k in LIGAS){const i=el("img");i.src=LGLOGO(k);i.title=lgName(k);h.appendChild(i);}
  $("#hsub").textContent=`${P.length} jugadores · 3 ligas`;
}
// Chips liga con logo
function buildLigaChips(){
  const c=$("#ligaChips");
  for(const k in LIGAS){
    const n=P.filter(p=>p.liga==k).length;
    const ch=el("div","chip on");ch.dataset.k=k;
    ch.innerHTML=`<img src="${LGLOGO(k)}" alt=""><span>${lgName(k)}</span><span class="cnt">${n}</span>`;
    ch.onclick=()=>{ch.classList.toggle("on");ch.classList.contains("on")?state.ligas.add(k):state.ligas.delete(k);render();};
    c.appendChild(ch);
  }
}
function buildPos(){
  const vals=[...new Set(P.map(p=>p.pos).filter(Boolean))].sort();
  const order=["Base","Escolta","Alero","Ala-Pívot","Pívot"];
  vals.sort((a,b)=>order.indexOf(a)-order.indexOf(b));
  vals.forEach(v=>{const o=el("option");o.value=v;o.textContent=v;$("#posSel").appendChild(o);});
  const real=P.filter(p=>p.pos_src&&p.pos_src!=='estimada').length;
  $("#posNote").innerHTML=`${real} con posición real · resto estimada (*)`;
}
// Filtro
function passes(p){
  if(!state.ligas.has(p.liga))return false;
  if(state.q&&!p.jugador.toLowerCase().includes(state.q))return false;
  if(p.min_pg<state.minMin)return false;
  if(state.pos&&p.pos!==state.pos)return false;
  if(state.edadMin!=null||state.edadMax!=null){
    if(p.edad==null)return state.edadSin;
    if(state.edadMin!=null&&p.edad<state.edadMin)return false;
    if(state.edadMax!=null&&p.edad>state.edadMax)return false;
  }
  return true;
}
function render(){
  let list=P.filter(passes);
  list.sort((a,b)=>(getSort(b,state.sort)||-1e9)-(getSort(a,state.sort)||-1e9));
  $("#count").innerHTML=`<b>${list.length}</b> jugadores`;
  const g=$("#grid");g.innerHTML="";
  const fr=document.createDocumentFragment();
  list.slice(0,300).forEach(p=>fr.appendChild(cardEl(p)));
  g.appendChild(fr);
  if(list.length>300)g.appendChild(el("div","note","… mostrando 300 de "+list.length+". Afiná los filtros."));
}
function cardEl(p){
  const c=el("div","card"+(state.cmpList.includes(p.id)?" sel":""));
  const pos=p.pos?`<span class="pill pos${p.pos_src=='estimada'?' est':''}">${p.pos}${p.pos_src=='estimada'?'*':''}</span>`:"";
  const age=p.edad?`<span class="pill age">${p.edad} años</span>`:"";
  c.innerHTML=`<img class="lgbadge" src="${LGLOGO(p.liga)}" alt="">
    <div class="cardtop">
      ${imgOr(p.img.foto,'foto',p.jugador[0])}
      <div class="who">
        <div class="nm">${p.jugador}</div>
        <div class="tm">${p.img.logo?`<img src="${p.img.logo}" loading="lazy">`:''}<span>${p.equipo}</span></div>
        <div class="meta">${pos}${age}<span class="pill">${p.min_pg} min/pg</span></div>
      </div>
    </div>
    <div class="stats">
      <div class="stat"><b>${p.trad.pts}</b><span>PTS</span></div>
      <div class="stat"><b>${p.trad.reb}</b><span>REB</span></div>
      <div class="stat"><b>${p.trad.ast}</b><span>AST</span></div>
      <div class="stat"><b>${p.adv.per}</b><span>PER</span></div>
    </div>`;
  c.onclick=()=>state.cmp?toggleCmp(p):openSheet(p);
  return c;
}
// Ficha
const sr=(k,v)=>`<div class="k">${k}</div><div class="v">${v}</div>`;
function sheetHTML(p){
  const s=p.splits,pmCls=p.adv.pm<0?"pm neg":"pm";
  const bio=[];if(p.pos)bio.push(`<span class="pill pos${p.pos_src=='estimada'?' est':''}">${p.pos}${p.pos_src=='estimada'?' (est.)':''}</span>`);
  if(p.edad)bio.push(`<span class="pill age">${p.edad} años</span>`);if(p.nac)bio.push(`nac. ${p.nac}`);
  const map=p.img.shotmap?`<img class="shotmap" src="${p.img.shotmap}" onerror="this.parentNode.innerHTML='<div class=miss>Mapa no disponible</div>'">`:`<div class="miss">Sin mapa de tiro</div>`;
  return `<div class="top">
    <img class="lgwm" src="${LGLOGO(p.liga)}" alt="">
    ${imgOr(p.img.foto,'foto-lg',p.jugador[0])}
    <div class="id"><h2>${p.jugador}</h2>
      <div class="m">${p.img.logo?`<img class="logo" src="${p.img.logo}">`:''}<b>${p.equipo}</b> · <img src="${LGLOGO(p.liga)}" style="height:18px;vertical-align:middle"> ${lgName(p.liga)} ${bio.length?'· '+bio.join(' '):''}</div>
    </div>
    <button class="close" onclick="closeSheet()">✕</button></div>
  <div class="body">
    <div>
      <div class="block"><h4>Tradicional · por partido</h4>
        <div class="big4">
          <div class="b"><b>${p.trad.pts}</b><span>Puntos</span></div>
          <div class="b"><b>${p.trad.reb}</b><span>Rebotes</span></div>
          <div class="b"><b>${p.trad.ast}</b><span>Asist.</span></div>
          <div class="b blue"><b>${p.trad.stl}</b><span>Robos</span></div>
          <div class="b blue"><b>${p.trad.blk}</b><span>Tapas</span></div>
          <div class="b blue"><b>${p.trad.tov}</b><span>Pérdidas</span></div>
        </div>
        <div class="kv">${sr("Partidos",p.juegos)}${sr("Minutos totales",p.min_total)}${sr("Min / partido",p.min_pg)}
          ${sr("Tiros de 2",`${s.fg2[0]}/${s.fg2[1]} · ${pct(s.fg2[2])}`)}
          ${sr("Tiros de 3",`${s.fg3[0]}/${s.fg3[1]} · ${pct(s.fg3[2])}`)}
          ${sr("Libres",`${s.ft[0]}/${s.ft[1]} · ${pct(s.ft[2])}`)}</div>
      </div>
      <div class="block" style="margin-top:20px"><h4>Avanzado</h4>
        <div class="kv">${sr("TS% (eficiencia real)",pct(p.adv.ts))}${sr("eFG% (tiro ajustado)",pct(p.adv.efg))}
          ${sr("3P%",pct(p.adv.fg3))}${sr("USG% (protagonismo)",pct(p.adv.usg))}
          ${sr("PER (valoración)",p.adv.per)}${sr("+/- (total)",`<span class="${pmCls}">${p.adv.pm>0?'+':''}${p.adv.pm}</span>`)}</div>
        <h4 style="margin-top:17px">Four Factors (jugador)</h4>
        <div class="ff"><div class="b"><b>${p.ff.efg}%</b><span>eFG%</span></div><div class="b"><b>${p.ff.tov}%</b><span>TOV%</span></div><div class="b"><b>${p.ff.ftr}%</b><span>FT Rate</span></div></div>
      </div>
    </div>
    <div class="block"><h4>Mapa de tiro <span style="text-transform:none;letter-spacing:0;color:var(--muted)">(color vs promedio de la liga)</span></h4>${map}</div>
  </div>`;
}
function openSheet(p){$("#sheet").innerHTML=sheetHTML(p);$("#overlay").classList.add("on");}
function closeSheet(){$("#overlay").classList.remove("on");}
$("#overlay").onclick=e=>{if(e.target.id=="overlay")closeSheet();};
document.addEventListener("keydown",e=>{if(e.key=="Escape")closeSheet();});
// Comparar
function toggleCmp(p){
  const i=state.cmpList.indexOf(p.id);
  if(i>=0)state.cmpList.splice(i,1);else if(state.cmpList.length<MAXCMP)state.cmpList.push(p.id);
  drawSlots();render();
}
function drawSlots(){
  const s=$("#slots");s.innerHTML="";
  state.cmpList.forEach(id=>{const p=P.find(x=>x.id==id);
    const sl=el("div","slot full");sl.innerHTML=`${p.jugador} <span class="x">✕</span>`;
    sl.querySelector(".x").onclick=()=>toggleCmp(p);s.appendChild(sl);});
  for(let i=state.cmpList.length;i<MAXCMP;i++)s.appendChild(el("div","slot","vacío"));
  $("#cmpGo").disabled=state.cmpList.length<2;
}
const ROWS=[
  ["Posición",p=>p.pos||"–",null],["Edad",p=>p.edad||"–",null],["Min/partido",p=>p.min_pg,"max"],
  ["Puntos",p=>p.trad.pts,"max"],["Rebotes",p=>p.trad.reb,"max"],["Asistencias",p=>p.trad.ast,"max"],
  ["Robos",p=>p.trad.stl,"max"],["Tapas",p=>p.trad.blk,"max"],["Pérdidas",p=>p.trad.tov,"min"],
  ["TS%",p=>p.adv.ts,"max"],["eFG%",p=>p.adv.efg,"max"],["3P%",p=>p.adv.fg3,"max"],
  ["USG%",p=>p.adv.usg,"max"],["PER",p=>p.adv.per,"max"],["+/-",p=>p.adv.pm,"max"]
];
$("#cmpGo").onclick=()=>{
  const ps=state.cmpList.map(id=>P.find(x=>x.id==id));
  let th=`<th class="lbl"></th>`+ps.map(p=>`<th><div class="phead">${imgOr(p.img.foto,'f',p.jugador[0])}<div class="n">${p.jugador}</div><div class="t"><img src="${LGLOGO(p.liga)}" style="height:12px;vertical-align:middle"> ${p.equipo}</div></div></th>`).join("");
  let rows=ROWS.map(([lab,fn,best])=>{
    const vals=ps.map(fn);
    let bi=-1;
    if(best){const nums=vals.map(v=>typeof v=="number"?v:NaN);const ext=best=="max"?Math.max(...nums):Math.min(...nums);if(isFinite(ext))bi=nums.indexOf(ext);}
    return `<tr><td class="lbl">${lab}</td>`+vals.map((v,i)=>`<td class="${i==bi?'best':''}">${typeof v=="number"?v:v}</td>`).join("")+`</tr>`;
  }).join("");
  const maps=ps.map(p=>`<figure>${p.img.shotmap?`<img src="${p.img.shotmap}">`:'<div class="miss" style="padding:20px">sin mapa</div>'}<figcaption>${p.jugador}</figcaption></figure>`).join("");
  $("#sheet").innerHTML=`<div class="top"><div class="id"><h2>Comparación</h2><div class="m">${ps.length} jugadores · mejor valor en verde</div></div><button class="close" onclick="closeSheet()">✕</button></div>
    <div style="overflow:auto"><table class="cmptable"><thead><tr>${th}</tr></thead><tbody>${rows}</tbody></table></div>
    <h4 style="margin:0;padding:16px 18px 0;font-size:11px;text-transform:uppercase;letter-spacing:1px;color:var(--muted)">Mapas de tiro</h4>
    <div class="cmpmaps">${maps}</div>`;
  $("#overlay").classList.add("on");
};
// Eventos
$("#q").oninput=e=>{state.q=e.target.value.toLowerCase().trim();render();};
$("#minMin").oninput=e=>{state.minMin=+e.target.value;$("#minLbl").textContent=e.target.value;render();};
$("#posSel").onchange=e=>{state.pos=e.target.value;render();};
$("#edadMin").oninput=e=>{state.edadMin=e.target.value?+e.target.value:null;render();};
$("#edadMax").oninput=e=>{state.edadMax=e.target.value?+e.target.value:null;render();};
$("#edadSinDato").onchange=e=>{state.edadSin=e.target.checked;render();};
$("#sortSel").onchange=e=>{state.sort=e.target.value;render();};
$("#reset").onclick=()=>{state.q="";state.minMin=10;state.pos="";state.edadMin=state.edadMax=null;
  $("#q").value="";$("#minMin").value=10;$("#minLbl").textContent=10;$("#posSel").value="";$("#edadMin").value="";$("#edadMax").value="";
  state.ligas=new Set(Object.keys(LIGAS));document.querySelectorAll("#ligaChips .chip").forEach(c=>c.classList.add("on"));render();};
$("#cmpToggle").onchange=e=>{state.cmp=e.target.checked;state.cmpList=[];$("#cmpbar").classList.toggle("on",state.cmp);$("#cmpSwitch").classList.toggle("on",state.cmp);drawSlots();render();};
// Init
function init(){
  buildHeader();buildLigaChips();buildPos();drawSlots();
  const cm=P.filter(p=>p.img.shotmap).length,ce=P.filter(p=>p.edad).length,cf=P.filter(p=>p.img.foto).length,pr=P.filter(p=>p.pos_src&&p.pos_src!='estimada').length;
  $("#dataNote").innerHTML=`Última temporada de cada liga.<br>Fotos ${cf} · Logos 146 · Mapas ${cm}<br>Edad ${ce} · Posición real ${pr} (resto est.*)`;
  $("#edadNote").textContent=ce?`${ce} jugadores con edad oficial.`:"";
  render();
}
init();
</script>
</body>
</html>
