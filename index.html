<!DOCTYPE html>
<html lang="es-AR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>STATSARG — Jugadores</title>
<style>
  :root{
    --bg:#0f1420; --panel:#171e2e; --panel2:#1e2740; --line:#2b3550;
    --txt:#e8ecf5; --muted:#8b96ad; --accent:#4f8cff; --accent2:#13c29b;
    --chip:#232d47; --warn:#f0a53d;
  }
  *{box-sizing:border-box}
  body{margin:0;font-family:"Segoe UI",system-ui,Arial,sans-serif;background:var(--bg);color:var(--txt);font-size:14px}
  a{color:inherit}
  header{padding:14px 20px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:16px;flex-wrap:wrap;background:linear-gradient(180deg,#141b2b,#0f1420)}
  header h1{font-size:18px;margin:0;letter-spacing:.5px}
  header .sub{color:var(--muted);font-size:12px}
  .wrap{display:flex;gap:0;min-height:calc(100vh - 56px)}
  /* Filtros */
  aside{width:290px;flex:none;border-right:1px solid var(--line);padding:16px;overflow:auto;background:var(--panel)}
  aside h3{font-size:11px;text-transform:uppercase;letter-spacing:1px;color:var(--muted);margin:18px 0 8px}
  aside h3:first-child{margin-top:0}
  .search{width:100%;padding:9px 11px;border-radius:8px;border:1px solid var(--line);background:var(--panel2);color:var(--txt);font-size:14px}
  .chips{display:flex;flex-wrap:wrap;gap:6px}
  .chip{padding:6px 10px;border-radius:20px;border:1px solid var(--line);background:var(--chip);cursor:pointer;font-size:12px;user-select:none;transition:.15s}
  .chip.on{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600}
  .chip.lf.on{background:var(--accent2);border-color:var(--accent2)}
  .rangeval{color:var(--accent);font-weight:700}
  input[type=range]{width:100%;accent-color:var(--accent)}
  .row2{display:flex;gap:8px}
  .row2 input{width:100%;padding:7px 9px;border-radius:7px;border:1px solid var(--line);background:var(--panel2);color:var(--txt)}
  select{width:100%;padding:8px;border-radius:7px;border:1px solid var(--line);background:var(--panel2);color:var(--txt)}
  .muted{color:var(--muted)}
  .note{font-size:11px;color:var(--warn);margin-top:5px}
  button.btn{width:100%;margin-top:14px;padding:9px;border-radius:8px;border:1px solid var(--line);background:var(--panel2);color:var(--txt);cursor:pointer}
  button.btn:hover{border-color:var(--accent)}
  /* Lista */
  main{flex:1;padding:16px;overflow:auto}
  .toolbar{display:flex;align-items:center;gap:12px;margin-bottom:12px;flex-wrap:wrap}
  .count{color:var(--muted);font-size:13px}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(215px,1fr));gap:10px}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:11px;padding:12px;cursor:pointer;transition:.15s;position:relative}
  .card:hover{border-color:var(--accent);transform:translateY(-2px)}
  .card.sel{border-color:var(--accent2);box-shadow:0 0 0 1px var(--accent2)}
  .card .nm{font-weight:700;font-size:14px;margin-bottom:2px}
  .card .tm{color:var(--muted);font-size:11.5px;display:flex;align-items:center;gap:6px}
  .lgtag{font-size:9.5px;padding:2px 6px;border-radius:5px;background:var(--chip);color:var(--muted);text-transform:uppercase;letter-spacing:.5px}
  .lgtag.laliga{color:#7fb0ff}.lgtag.liga-argentina{color:#ffd479}.lgtag.liga-federal{color:#5fe0bf}
  .card .stats{display:flex;gap:12px;margin-top:9px}
  .card .stat b{display:block;font-size:16px}
  .card .stat span{font-size:9.5px;color:var(--muted);text-transform:uppercase}
  .logo-mini{width:20px;height:20px;object-fit:contain;border-radius:3px;background:#fff2}
  /* Ficha */
  .overlay{position:fixed;inset:0;background:#0009;display:none;z-index:50}
  .overlay.on{display:flex;align-items:flex-start;justify-content:center;overflow:auto;padding:24px}
  .sheet{background:var(--panel);border:1px solid var(--line);border-radius:16px;max-width:960px;width:100%;padding:0;overflow:hidden}
  .sheet .top{display:flex;gap:16px;padding:18px 22px;background:linear-gradient(180deg,var(--panel2),var(--panel));border-bottom:1px solid var(--line);align-items:center}
  .foto{width:64px;height:64px;border-radius:12px;object-fit:cover;background:var(--chip);border:1px solid var(--line)}
  .logo{width:46px;height:46px;object-fit:contain;background:#fff1;border-radius:8px;padding:3px}
  .sheet .top .id h2{margin:0;font-size:22px}
  .sheet .top .id .m{color:var(--muted);font-size:13px;margin-top:3px}
  .close{margin-left:auto;background:var(--chip);border:1px solid var(--line);color:var(--txt);width:34px;height:34px;border-radius:8px;cursor:pointer;font-size:18px}
  .body{display:grid;grid-template-columns:1fr 1fr;gap:20px;padding:22px}
  @media(max-width:820px){.body{grid-template-columns:1fr}}
  .block h4{font-size:11px;text-transform:uppercase;letter-spacing:1px;color:var(--muted);margin:0 0 10px;border-bottom:1px solid var(--line);padding-bottom:6px}
  .kv{display:grid;grid-template-columns:1fr auto;gap:6px 12px;font-size:13.5px}
  .kv .k{color:var(--muted)}
  .kv .v{font-weight:700;text-align:right}
  .big4{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;text-align:center;margin-bottom:14px}
  .big4 .b{background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:9px 4px}
  .big4 .b b{display:block;font-size:20px}
  .big4 .b span{font-size:9.5px;color:var(--muted);text-transform:uppercase}
  .ff{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;text-align:center;margin-top:6px}
  .ff .b{background:var(--panel2);border:1px solid var(--line);border-radius:9px;padding:8px 3px}
  .ff .b b{display:block;font-size:16px}.ff .b span{font-size:9px;color:var(--muted)}
  .shotmap{width:100%;border-radius:12px;background:#fff;border:1px solid var(--line)}
  .shotmap-wrap .miss{color:var(--muted);font-size:12px;padding:30px;text-align:center;border:1px dashed var(--line);border-radius:12px}
  .pm{color:var(--accent2)} .pm.neg{color:#ff7b7b}
  /* Comparar */
  .cmpbar{position:fixed;bottom:0;left:0;right:0;background:var(--panel2);border-top:1px solid var(--accent);padding:10px 20px;display:none;align-items:center;gap:14px;z-index:40}
  .cmpbar.on{display:flex}
  .cmpbar .slot{padding:6px 12px;border:1px dashed var(--line);border-radius:8px;color:var(--muted);font-size:13px}
  .cmpbar .slot.full{border-style:solid;border-color:var(--accent2);color:var(--txt)}
  .cmpbar button{margin-left:auto;padding:8px 16px;border-radius:8px;border:none;background:var(--accent);color:#fff;cursor:pointer;font-weight:600}
  .cmpbar button:disabled{opacity:.4;cursor:default}
  .cmp-body{display:grid;grid-template-columns:1fr 1fr;gap:0}
  .cmp-col{padding:18px}
  .cmp-col:first-child{border-right:1px solid var(--line)}
  .cmp-row{display:grid;grid-template-columns:1fr;gap:0}
</style>
</head>
<body>
<header>
  <h1>STATSARG · <span style="color:var(--accent)">Jugadores</span></h1>
  <span class="sub" id="hsub">cargando…</span>
  <label style="margin-left:auto;font-size:12px;color:var(--muted);display:flex;align-items:center;gap:6px;cursor:pointer">
    <input type="checkbox" id="cmpToggle"> Modo comparar
  </label>
</header>

<div class="wrap">
  <aside>
    <h3>Buscar</h3>
    <input class="search" id="q" placeholder="Nombre del jugador…">

    <h3>Liga</h3>
    <div class="chips" id="ligaChips"></div>

    <h3>Minutos (mínimo) · <span class="rangeval" id="minLbl">200</span></h3>
    <input type="range" id="minMin" min="0" max="1200" step="20" value="200">

    <h3>Posición</h3>
    <select id="posSel"><option value="">Todas</option></select>
    <div class="note" id="posNote"></div>

    <h3>Edad</h3>
    <div class="row2"><input type="number" id="edadMin" placeholder="mín" min="14" max="50"><input type="number" id="edadMax" placeholder="máx" min="14" max="50"></div>
    <label style="font-size:11.5px;color:var(--muted);display:flex;gap:6px;margin-top:6px;cursor:pointer"><input type="checkbox" id="edadSinDato" checked> incluir sin edad</label>
    <div class="note" id="edadNote" style="color:var(--muted)"></div>

    <button class="btn" id="reset">Limpiar filtros</button>
    <div class="note muted" style="color:var(--muted);margin-top:16px" id="dataNote"></div>
  </aside>

  <main>
    <div class="toolbar">
      <span class="count" id="count"></span>
      <select id="sortSel" style="width:auto;margin-left:auto">
        <option value="pts">Ordenar: Puntos</option>
        <option value="per">Valoración (PER)</option>
        <option value="min_total">Minutos</option>
        <option value="ts">TS%</option>
        <option value="reb">Rebotes</option>
        <option value="ast">Asistencias</option>
        <option value="pm">+/-</option>
      </select>
    </div>
    <div class="grid" id="grid"></div>
  </main>
</div>

<!-- Ficha individual -->
<div class="overlay" id="overlay"><div class="sheet" id="sheet"></div></div>

<!-- Barra comparar -->
<div class="cmpbar" id="cmpbar">
  <strong style="font-size:13px">Comparar:</strong>
  <span class="slot" id="slot0">Elegí jugador 1</span>
  <span class="slot" id="slot1">Elegí jugador 2</span>
  <button id="cmpGo" disabled>Comparar →</button>
</div>

<script src="players_data.js"></script>
<script>
const DATA = window.STATSARG;
const P = DATA.players;
const LIGAS = DATA.ligas;
const state = { ligas:new Set(Object.keys(LIGAS)), q:"", minMin:200, pos:"", edadMin:null, edadMax:null, edadSin:true, sort:"pts", sel:null, cmp:false, cmpList:[] };

const $ = s => document.querySelector(s);
const el = (t,c,h)=>{const e=document.createElement(t);if(c)e.className=c;if(h!=null)e.innerHTML=h;return e;};
const pct = v => (v==null?"–":v.toFixed(1)+"%");
const lgName = k => LIGAS[k]||k;

// stat accessors
const getSort = (p,k)=>({pts:p.trad.pts,per:p.adv.per,min_total:p.min_total,ts:p.adv.ts,reb:p.trad.reb,ast:p.trad.ast,pm:p.adv.pm}[k]);

// ---- Filtros UI ----
function buildLigaChips(){
  const c=$("#ligaChips");
  for(const k in LIGAS){
    const ch=el("div","chip on"+(k=="liga-federal"?" lf":""),lgName(k));
    ch.dataset.k=k;
    ch.onclick=()=>{ch.classList.toggle("on"); if(ch.classList.contains("on"))state.ligas.add(k);else state.ligas.delete(k); render();};
    c.appendChild(ch);
  }
}
function buildPos(){
  const vals=[...new Set(P.map(p=>p.pos).filter(Boolean))].sort();
  const sel=$("#posSel");
  vals.forEach(v=>{const o=el("option");o.value=v;o.textContent=v;sel.appendChild(o);});
  const real=P.filter(p=>p.pos&&p.pos_src&&p.pos_src!=='estimada').length;
  const est=P.filter(p=>p.pos_src==='estimada').length;
  $("#posNote").innerHTML=`${real} con posición real · ${est} estimada (*). <span style="color:var(--muted)">Fuente real: proballers (LNB), latinbasket (Liga Arg.).</span>`;
}

// ---- Render lista ----
function passes(p){
  if(!state.ligas.has(p.liga))return false;
  if(state.q && !p.jugador.toLowerCase().includes(state.q))return false;
  if(p.min_total<state.minMin)return false;
  if(state.pos && p.pos!==state.pos)return false;
  if(state.edadMin!=null||state.edadMax!=null){
    if(p.edad==null)return state.edadSin;
    if(state.edadMin!=null&&p.edad<state.edadMin)return false;
    if(state.edadMax!=null&&p.edad>state.edadMax)return false;
  }
  return true;
}
function render(){
  let list=P.filter(passes);
  list.sort((a,b)=>(getSort(b,state.sort)||-1e9)-(getSort(a,state.sort)||-1e9));
  $("#count").textContent=`${list.length} jugadores`;
  const g=$("#grid"); g.innerHTML="";
  const frag=document.createDocumentFragment();
  list.slice(0,400).forEach(p=>frag.appendChild(cardEl(p)));
  g.appendChild(frag);
  if(list.length>400){g.appendChild(el("div","muted","… mostrando 400 de "+list.length+". Afiná los filtros."));}
}
function cardEl(p){
  const c=el("div","card"+(state.cmpList.includes(p.id)?" sel":""));
  const logo=p.img.logo?`<img class="logo-mini" src="${p.img.logo}" onerror="this.style.display='none'">`:"";
  c.innerHTML=`<div class="nm">${p.jugador}</div>
    <div class="tm">${logo}<span>${p.equipo}</span></div>
    <div class="tm" style="margin-top:4px"><span class="lgtag ${p.liga}">${lgName(p.liga)}</span>${p.pos?' · '+p.pos+(p.pos_src=='estimada'?'*':''):''} · ${p.min_pg} min</div>
    <div class="stats">
      <div class="stat"><b>${p.trad.pts}</b><span>PTS</span></div>
      <div class="stat"><b>${p.trad.reb}</b><span>REB</span></div>
      <div class="stat"><b>${p.trad.ast}</b><span>AST</span></div>
      <div class="stat"><b>${p.adv.per}</b><span>PER</span></div>
    </div>`;
  c.onclick=()=>state.cmp?toggleCmp(p):openSheet(p);
  return c;
}

// ---- Ficha ----
function statRow(k,v){return `<div class="k">${k}</div><div class="v">${v}</div>`;}
function sheetHTML(p){
  const foto=p.img.foto?`<img class="foto" src="${p.img.foto}" onerror="this.style.visibility='hidden'">`:`<div class="foto"></div>`;
  const logo=p.img.logo?`<img class="logo" src="${p.img.logo}" onerror="this.style.display='none'">`:"";
  const bio=[]; if(p.pos)bio.push(p.pos+(p.pos_src=='estimada'?' <span style="color:var(--warn);font-size:11px">(est.)</span>':'')); if(p.edad)bio.push(p.edad+" años"); if(p.nac)bio.push(p.nac);
  const s=p.splits;
  const pmCls=p.adv.pm<0?"pm neg":"pm";
  const map=p.img.shotmap
    ?`<img class="shotmap" src="${p.img.shotmap}" onerror="this.parentNode.innerHTML='<div class=miss>Mapa no disponible</div>'">`
    :`<div class="miss">Mapa de tiro no generado</div>`;
  return `
  <div class="top">
    ${foto}
    <div class="id"><h2>${p.jugador}</h2>
      <div class="m">${logo?logo+' ':''}${p.equipo} · <span class="lgtag ${p.liga}">${lgName(p.liga)}</span>${bio.length?' · '+bio.join(' · '):' · <span style="color:var(--warn)">sin datos de posición/edad</span>'}</div>
    </div>
    <button class="close" onclick="closeSheet()">✕</button>
  </div>
  <div class="body">
    <div>
      <div class="block">
        <h4>Tradicional (por partido)</h4>
        <div class="big4" style="grid-template-columns:repeat(3,1fr)">
          <div class="b"><b>${p.trad.pts}</b><span>Puntos</span></div>
          <div class="b"><b>${p.trad.reb}</b><span>Rebotes</span></div>
          <div class="b"><b>${p.trad.ast}</b><span>Asist.</span></div>
          <div class="b"><b>${p.trad.stl}</b><span>Robos</span></div>
          <div class="b"><b>${p.trad.blk}</b><span>Tapas</span></div>
          <div class="b"><b>${p.trad.tov}</b><span>Pérdidas</span></div>
        </div>
        <div class="kv">
          ${statRow("Partidos jugados",p.juegos)}
          ${statRow("Minutos totales",p.min_total)}
          ${statRow("Minutos / partido",p.min_pg)}
          ${statRow("Tiros de 2",`${s.fg2[0]}/${s.fg2[1]} · ${pct(s.fg2[2])}`)}
          ${statRow("Tiros de 3",`${s.fg3[0]}/${s.fg3[1]} · ${pct(s.fg3[2])}`)}
          ${statRow("Libres",`${s.ft[0]}/${s.ft[1]} · ${pct(s.ft[2])}`)}
        </div>
      </div>
      <div class="block" style="margin-top:18px">
        <h4>Avanzado</h4>
        <div class="kv">
          ${statRow("TS% (eficiencia real)",pct(p.adv.ts))}
          ${statRow("eFG% (tiro ajustado)",pct(p.adv.efg))}
          ${statRow("3P%",pct(p.adv.fg3))}
          ${statRow("USG% (protagonismo)",pct(p.adv.usg))}
          ${statRow("PER (valoración)",p.adv.per)}
          ${statRow("+/- (total)",`<span class="${pmCls}">${p.adv.pm>0?'+':''}${p.adv.pm}</span>`)}
        </div>
        <h4 style="margin-top:16px">Four Factors (jugador)</h4>
        <div class="ff">
          <div class="b"><b>${p.ff.efg}%</b><span>eFG%</span></div>
          <div class="b"><b>${p.ff.tov}%</b><span>TOV%</span></div>
          <div class="b"><b>${p.ff.ftr}%</b><span>FT Rate</span></div>
        </div>
      </div>
    </div>
    <div>
      <div class="block">
        <h4>Mapa de tiro <span class="muted" style="text-transform:none;letter-spacing:0">(vs promedio de la liga)</span></h4>
        <div class="shotmap-wrap">${map}</div>
      </div>
    </div>
  </div>`;
}
function openSheet(p){ $("#sheet").innerHTML=sheetHTML(p); $("#overlay").classList.add("on"); }
function closeSheet(){ $("#overlay").classList.remove("on"); }
$("#overlay").onclick=e=>{if(e.target.id=="overlay")closeSheet();};
document.addEventListener("keydown",e=>{if(e.key=="Escape")closeSheet();});

// ---- Comparar ----
function toggleCmp(p){
  const i=state.cmpList.indexOf(p.id);
  if(i>=0)state.cmpList.splice(i,1);
  else if(state.cmpList.length<2)state.cmpList.push(p.id);
  updateCmpBar(); render();
}
function updateCmpBar(){
  [0,1].forEach(i=>{
    const id=state.cmpList[i]; const slot=$("#slot"+i);
    if(id){const p=P.find(x=>x.id==id);slot.textContent=p.jugador;slot.classList.add("full");}
    else{slot.textContent="Elegí jugador "+(i+1);slot.classList.remove("full");}
  });
  $("#cmpGo").disabled=state.cmpList.length!=2;
}
$("#cmpGo").onclick=()=>{
  const [a,b]=state.cmpList.map(id=>P.find(x=>x.id==id));
  $("#sheet").innerHTML=`<div class="top"><div class="id"><h2>Comparativa</h2><div class="m">${a.jugador} vs ${b.jugador}</div></div><button class="close" onclick="closeSheet()">✕</button></div>
   <div class="cmp-body"><div class="cmp-col">${cmpCol(a)}</div><div class="cmp-col">${cmpCol(b)}</div></div>`;
  $("#overlay").classList.add("on");
};
function cmpCol(p){
  const map=p.img.shotmap?`<img class="shotmap" src="${p.img.shotmap}" onerror="this.style.display='none'">`:`<div class="miss">sin mapa</div>`;
  const win=(k,hi)=>"";
  return `<h3 style="margin:0 0 4px">${p.jugador}</h3>
    <div class="muted" style="margin-bottom:12px">${p.equipo} · ${lgName(p.liga)}</div>
    <div class="kv">
      ${statRow("PTS",p.trad.pts)}${statRow("REB",p.trad.reb)}${statRow("AST",p.trad.ast)}
      ${statRow("PER",p.adv.per)}${statRow("TS%",pct(p.adv.ts))}${statRow("USG%",pct(p.adv.usg))}
      ${statRow("+/-",p.adv.pm)}${statRow("Min/pg",p.min_pg)}
    </div>
    <div style="margin-top:14px">${map}</div>`;
}

// ---- Eventos filtros ----
$("#q").oninput=e=>{state.q=e.target.value.toLowerCase().trim();render();};
$("#minMin").oninput=e=>{state.minMin=+e.target.value;$("#minLbl").textContent=e.target.value;render();};
$("#posSel").onchange=e=>{state.pos=e.target.value;render();};
$("#edadMin").oninput=e=>{state.edadMin=e.target.value?+e.target.value:null;render();};
$("#edadMax").oninput=e=>{state.edadMax=e.target.value?+e.target.value:null;render();};
$("#edadSinDato").onchange=e=>{state.edadSin=e.target.checked;render();};
$("#sortSel").onchange=e=>{state.sort=e.target.value;render();};
$("#reset").onclick=()=>{state.q="";state.minMin=200;state.pos="";state.edadMin=state.edadMax=null;
  $("#q").value="";$("#minMin").value=200;$("#minLbl").textContent=200;$("#posSel").value="";$("#edadMin").value="";$("#edadMax").value="";
  state.ligas=new Set(Object.keys(LIGAS));document.querySelectorAll("#ligaChips .chip").forEach(c=>c.classList.add("on"));render();};
$("#cmpToggle").onchange=e=>{state.cmp=e.target.checked;state.cmpList=[];$("#cmpbar").classList.toggle("on",state.cmp);updateCmpBar();render();};

// ---- Init ----
function init(){
  buildLigaChips(); buildPos();
  $("#hsub").textContent=`${P.length} jugadores · LNB ${P.filter(p=>p.liga=='laliga').length} · Liga Argentina ${P.filter(p=>p.liga=='liga-argentina').length} · Liga Federal ${P.filter(p=>p.liga=='liga-federal').length}`;
  const conMapa=P.filter(p=>p.img.shotmap).length;
  const posReal=P.filter(p=>p.pos_src&&p.pos_src!=='estimada').length;
  const conEdad=P.filter(p=>p.edad).length;
  $("#dataNote").innerHTML=`Datos: última temporada de cada liga.<br>Mapas de tiro: ${conMapa} · Posición real: ${posReal} (resto estimada*) · Edad: ${conEdad}.`;
  const en=$("#edadNote"); if(en) en.textContent=conEdad?`${conEdad} jugadores con edad oficial.`:"⏳ Edad no cargada.";
  render();
}
init();
</script>
</body>
</html>
