<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>STATSARG · Asistidores Liga Federal</title>
<style>
@font-face{font-family:'Archivo Black';src:url('fonts/archivo-black.ttf');font-weight:900}
@font-face{font-family:'Barlow Condensed';src:url('fonts/barlow-condensed-bold.ttf');font-weight:700}
@font-face{font-family:'Barlow Condensed';src:url('fonts/barlow-condensed-semibold.ttf');font-weight:600}
@font-face{font-family:'Barlow Semi';src:url('fonts/barlow-semibold.ttf');font-weight:600}
@font-face{font-family:'Barlow Semi';src:url('fonts/barlow-medium.ttf');font-weight:500}

:root{
  --bone:#f4f0e6;
  --bone2:#ece6d7;
  --navy:#0e1f33;
  --navy-soft:#3d5068;
  --cyan:#2ee0c6;
  --teal-ink:#0c8a77;
  --orange:#e8622d;
  --wood:#d9c39a;
  --card:#fffdf8;
  --line:#e2d9c4;
}
*{margin:0;padding:0;box-sizing:border-box}
body{background:#555;font-family:'Barlow Semi',sans-serif;color:var(--navy)}

.slide{
  width:1080px;height:1350px;position:relative;overflow:hidden;
  background:var(--bone);
  margin:24px auto;
}
.court{position:absolute;inset:0;z-index:0}
.grain{position:absolute;inset:0;z-index:0;opacity:.5;
  background:
    radial-gradient(1200px 600px at 85% -10%, rgba(46,224,198,.14), transparent 60%),
    radial-gradient(1000px 700px at -10% 110%, rgba(232,98,45,.10), transparent 55%);
}
.content{position:relative;z-index:2;height:100%;display:flex;flex-direction:column;padding:56px 64px}

/* ---------- shared ---------- */
.topbar{display:flex;align-items:center;justify-content:space-between}
.brand{display:flex;align-items:center;gap:18px}
.brand img.logo{width:96px;height:96px}
.brand .word{font-family:'Archivo Black';font-size:34px;letter-spacing:1px}
.brand .word span{color:var(--teal-ink)}
.liga-chip{display:flex;align-items:center;gap:14px;background:var(--card);border:2px solid var(--line);
  border-radius:999px;padding:10px 26px 10px 12px;box-shadow:0 4px 14px rgba(14,31,51,.08)}
.liga-chip img{width:60px;height:60px;object-fit:contain}
.liga-chip .t{font-family:'Barlow Condensed';font-weight:700;font-size:30px;letter-spacing:2px;text-transform:uppercase}

.kicker{font-family:'Barlow Condensed';font-weight:700;letter-spacing:6px;text-transform:uppercase;
  color:var(--orange);font-size:30px}
.desc{font-size:29px;line-height:1.32;color:var(--navy-soft);font-weight:500}
.desc b{color:var(--navy)}

.footer{margin-top:auto;display:flex;align-items:center;justify-content:space-between;
  border-top:3px solid var(--navy);padding-top:22px}
.footer .fbrand{font-family:'Archivo Black';font-size:26px;letter-spacing:1px}
.footer .fbrand span{color:var(--teal-ink)}
.footer .fnote{font-family:'Barlow Condensed';font-weight:600;font-size:26px;letter-spacing:3px;
  text-transform:uppercase;color:var(--navy-soft)}
.footer .fnote b{color:var(--orange)}

/* ---------- cover ---------- */
.cover .title-block{margin-top:34px}
.cover h1{font-family:'Archivo Black';font-size:86px;line-height:.98;text-transform:uppercase;letter-spacing:-1px}
.cover h1 .hl{color:var(--teal-ink)}
.cover .subtitle{margin-top:24px;display:inline-flex;align-items:center;gap:20px}
.cover .subtitle .bar{width:86px;height:12px;background:var(--orange);border-radius:6px}
.cover .subtitle .txt{font-family:'Barlow Condensed';font-weight:700;font-size:44px;letter-spacing:4px;
  text-transform:uppercase;color:var(--navy)}
.podio{margin-top:60px;display:flex;gap:28px}
.pcard{flex:1;background:var(--card);border:2px solid var(--line);border-radius:26px;padding:20px 18px 18px;
  text-align:center;box-shadow:0 10px 28px rgba(14,31,51,.10);position:relative}
.pcard.first{transform:translateY(-26px);border-color:var(--cyan);box-shadow:0 14px 34px rgba(12,138,119,.18)}
.pcard .rank{position:absolute;top:-24px;left:50%;transform:translateX(-50%);
  width:56px;height:56px;border-radius:50%;background:var(--navy);color:#fff;
  font-family:'Archivo Black';font-size:28px;display:flex;align-items:center;justify-content:center;
  border:4px solid var(--bone)}
.pcard.first .rank{background:var(--orange)}
.pcard .ph{width:196px;height:226px;object-fit:cover;object-position:top;border-radius:18px;margin:14px auto 0;
  display:block;background:#e8e2d2}
.pcard .nm{font-family:'Barlow Condensed';font-weight:700;font-size:34px;text-transform:uppercase;margin-top:14px;line-height:1}
.pcard .tm{display:flex;align-items:center;justify-content:center;gap:10px;margin-top:10px;
  font-family:'Barlow Condensed';font-weight:600;font-size:26px;letter-spacing:1px;color:var(--navy-soft);text-transform:uppercase}
.pcard .tm img{width:34px;height:34px;object-fit:contain}
.pcard .ast{margin-top:10px;font-family:'Archivo Black';font-size:46px;color:var(--teal-ink)}
.pcard .astlbl{font-family:'Barlow Condensed';font-weight:600;font-size:24px;letter-spacing:3px;color:var(--navy-soft)}

/* ---------- player profile ---------- */
.rankband{display:flex;align-items:center;gap:22px;margin-top:48px}
.rankband .num{font-family:'Archivo Black';font-size:120px;color:var(--orange);line-height:.9}
.rankband .lbl .k{font-family:'Barlow Condensed';font-weight:700;font-size:30px;letter-spacing:5px;
  text-transform:uppercase;color:var(--teal-ink)}
.rankband .lbl h2{font-family:'Archivo Black';font-size:66px;text-transform:uppercase;line-height:1;margin-top:6px}
.rankband .lbl .sub{display:flex;align-items:center;gap:12px;margin-top:12px;
  font-family:'Barlow Condensed';font-weight:600;font-size:32px;letter-spacing:1px;color:var(--navy-soft);text-transform:uppercase}
.rankband .lbl .sub img{width:44px;height:44px;object-fit:contain}
.rankband .lbl .sub .dot{width:8px;height:8px;border-radius:50%;background:var(--orange)}

.profile-main{display:flex;gap:44px;margin-top:46px;align-items:stretch}
.photo-wrap{width:400px;flex:none;position:relative}
.photo-wrap .ph{width:400px;height:476px;object-fit:cover;object-position:top;border-radius:28px;
  border:3px solid var(--line);background:#e8e2d2;box-shadow:0 14px 34px rgba(14,31,51,.14);display:block}
.photo-wrap .tag{position:absolute;left:50%;bottom:-26px;transform:translateX(-50%);
  background:var(--navy);color:#fff;border-radius:999px;padding:12px 30px;white-space:nowrap;
  font-family:'Barlow Condensed';font-weight:700;font-size:30px;letter-spacing:3px;text-transform:uppercase}
.photo-wrap .tag span{color:var(--cyan)}

.stats-col{flex:1;display:flex;flex-direction:column;gap:24px}
.hero-tile{background:var(--navy);border-radius:26px;padding:26px 34px;display:flex;align-items:center;
  justify-content:space-between;box-shadow:0 14px 30px rgba(14,31,51,.22)}
.hero-tile .lbl{font-family:'Barlow Condensed';font-weight:600;font-size:32px;letter-spacing:4px;
  color:#bcd3e6;text-transform:uppercase;line-height:1.15}
.hero-tile .val{font-family:'Archivo Black';font-size:96px;color:var(--cyan);line-height:1}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}
.tile{background:var(--card);border:2px solid var(--line);border-radius:20px;padding:18px 10px 14px;text-align:center}
.tile .v{font-family:'Archivo Black';font-size:44px;line-height:1}
.tile .k{font-family:'Barlow Condensed';font-weight:600;font-size:23px;letter-spacing:2px;color:var(--navy-soft);
  text-transform:uppercase;margin-top:8px}
.tile.neg .v{color:#b3403c}
.tile.pos .v{color:var(--teal-ink)}

.profile .descbox{margin-top:58px;background:var(--card);border-left:10px solid var(--orange);
  border-radius:0 20px 20px 0;padding:24px 30px;box-shadow:0 8px 20px rgba(14,31,51,.07)}

/* ---------- shotmap slide ---------- */
.shot-head{margin-top:26px}
.shot-head .k{font-family:'Barlow Condensed';font-weight:700;font-size:30px;letter-spacing:5px;
  text-transform:uppercase;color:var(--teal-ink)}
.shot-head h2{font-family:'Archivo Black';font-size:44px;text-transform:uppercase;line-height:1;margin-top:6px}
.shot-main{display:flex;gap:28px;margin-top:24px;flex:1;min-height:0;align-items:flex-start}
.mapcard{width:478px;flex:none;background:#fff;border:2px solid var(--line);border-radius:26px;overflow:hidden;
  box-shadow:0 14px 34px rgba(14,31,51,.12);position:relative}
.mapcard .crop{width:478px;overflow:hidden;position:relative}
.mapcard img{width:478px;display:block;margin-top:-64px}
.mapcard .cap{background:var(--navy);color:#fff;text-align:center;
  font-family:'Barlow Condensed';font-weight:700;font-size:22px;letter-spacing:2px;text-transform:uppercase;padding:10px 6px}
.mapcard .cap span{color:var(--cyan)}

.side-col{flex:1;min-width:0;display:flex;flex-direction:column;gap:20px}
.panel{background:var(--card);border:2px solid var(--line);border-radius:22px;padding:18px 20px;min-width:0}
.panel h3{font-family:'Barlow Condensed';font-weight:700;font-size:25px;letter-spacing:2px;
  text-transform:uppercase;color:var(--navy);display:flex;align-items:center;gap:12px}
.panel h3::before{content:'';width:14px;height:14px;border-radius:4px;background:var(--orange)}
.panel.dark{background:var(--navy);border-color:var(--navy)}
.panel.dark h3{color:#fff}
.panel.dark h3::before{background:var(--cyan)}

.splitrow{display:flex;gap:12px;margin-top:14px}
.split{flex:1;min-width:0;text-align:center;background:var(--bone);border-radius:16px;padding:12px 4px 10px}
.split .v{font-family:'Archivo Black';font-size:31px}
.split .f{font-family:'Barlow Condensed';font-weight:600;font-size:20px;color:var(--navy-soft);margin-top:4px}
.split .k{font-family:'Barlow Condensed';font-weight:700;font-size:20px;letter-spacing:1.5px;color:var(--teal-ink);margin-top:6px}

.possrow{display:flex;gap:12px;margin-top:14px}
.poss{flex:1;min-width:0;text-align:center;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.14);
  border-radius:16px;padding:16px 6px 12px}
.poss .v{font-family:'Archivo Black';font-size:33px;color:#fff}
.poss .v.cy{color:var(--cyan)}
.poss .k{font-family:'Barlow Condensed';font-weight:600;font-size:18px;letter-spacing:1px;color:#bcd3e6;
  text-transform:uppercase;margin-top:8px;line-height:1.1}
.ratio-note{margin-top:12px;font-family:'Barlow Condensed';font-weight:600;font-size:23px;color:#bcd3e6;
  text-align:center;letter-spacing:1px}
.ratio-note b{color:var(--cyan);font-family:'Archivo Black';font-size:26px;letter-spacing:0}

.shot .descbox{margin-top:20px;background:var(--card);border-left:10px solid var(--orange);
  border-radius:0 20px 20px 0;padding:22px 28px;box-shadow:0 8px 20px rgba(14,31,51,.07)}
</style>
</head>

function profileSlide(p,i){
return `
<div class="slide profile" id="s${2+i*2}">
  <div class="court-holder"></div><div class="grain"></div>
  <div class="content">
    <div class="topbar">
      <div class="brand"><img class="logo" style="width:78px;height:78px" src="../../assets/statsarg-logo.svg">

    </div>

    <div class="profile-main">

        <div class="tag">${p.pj} PJ · <span>${p.min} min</span> por juego</div>

          <div class="val">${p.ast}</div>
        </div>
        <div class="grid">
          <div class="tile"><div class="v">${p.pts}</div><div class="k">Puntos</div></div>
          <div class="tile"><div class="v">${p.reb}</div><div class="k">Rebotes</div></div>
          <div class="tile"><div class="v">${p.rob}</div><div class="k">Robos</div></div>
          <div class="tile"><div class="v">${p.per}</div><div class="k">Pérdidas</div></div>
          <div class="tile ${p.pmClass}"><div class="v">${p.pm}</div><div class="k">+/− Total</div></div>

</div>`;

function shotSlide(p,i){

  <div class="court-holder"></div><div class="grain"></div>

    </div>

    <div class="shot-main">
      <div class="mapcard">
        <div class="crop"><img src="${p.shot}"></div>
        <div class="cap">Mapa de tiro por zonas · <span>vs. liga</span></div>
      </div>
      <div class="side-col">
        <div class="panel">
          <h3>Detalle de tiro</h3>
          <div class="splitrow">
            <div class="split"><div class="v">${p.fg2.p}</div><div class="f">${p.fg2.f}</div><div class="k">Dobles</div></div>
            <div class="split"><div class="v">${p.fg3.p}</div><div class="f">${p.fg3.f}</div><div class="k">Triples</div></div>
            <div class="split"><div class="v">${p.ft.p}</div><div class="f">${p.ft.f}</div><div class="k">Libres</div></div>
          </div>
          <div class="splitrow">
            <div class="split" style="background:rgba(46,224,198,.14)"><div class="v" style="color:var(--teal-ink)">${p.ts}</div><div class="k">Tiro real (TS%)</div></div>
          </div>
        </div>
        <div class="panel dark">
          <h3>Cómo termina las posesiones</h3>
          <div class="possrow">
            <div class="poss"><div class="v cy">${p.ast}</div><div class="k">Asist. / juego</div></div>
            <div class="poss"><div class="v">${p.per}</div><div class="k">Pérdidas / juego</div></div>
            <div class="poss"><div class="v">${p.usg}</div><div class="k">Uso (USG%)</div></div>
          </div>
          <div class="ratio-note">Genera <b>${p.ratio}</b> asistencias por cada pérdida</div>
        </div>
      </div>
    </div>

    <div class="descbox"><div class="desc">${p.desc2}</div></div>

    <div class="footer">
      <div class="fbrand">STATS<span>ARG.</span></div>
      <div class="fnote">${i<2 ? 'Sigue el podio <b>&#8594;</b>' : 'Fin del podio · <b>STATSARG</b>'}</div>
    </div>
  </div>
</div>`;
}

let html='';
PLAYERS.forEach((p,i)=>{ html+=profileSlide(p,i)+shotSlide(p,i); });
document.getElementById('players-mount').outerHTML=html;
document.querySelectorAll('.court-holder').forEach(el=>{ el.outerHTML=COURT; });
</script>
</body>
</html>
